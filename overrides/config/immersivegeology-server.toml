[remove_non_ig_ore_types]
	#Configure which default ores (from Minecraft and Immersive Engineering) should be removed during world generation. Changes require a world reload.
	#Remove Minecraft's Iron Ore during world generation.
	remove_iron = true
	#Remove Minecraft's Copper Ore during world generation.
	remove_copper = true
	#Remove Minecraft's Gold Ore during world generation.
	remove_gold = true
	#Remove Immersive Engineering's Bauxite Ore.
	remove_ie_bauxite = true
	#Remove Immersive Engineering's Lead Ore.
	remove_ie_lead = true
	#Remove Immersive Engineering's Silver Ore.
	remove_ie_silver = true
	#Remove Immersive Engineering's Uranium Ore.
	remove_ie_uranium = true
	#Remove Immersive Engineering's Nickel Ore.
	remove_ie_nickel = true
	#Enable logging of the ore removal process for debugging or performance analysis.
	log_process = false
	#Specify biomes where ore removal should be disabled. Useful for preserving ore generation in specific areas without disabling the system entirely.
	#List of biome tags (e.g., 'minecraft:is_overworld', 'c:is_sandy', 'c:is_dry/overworld', 'minecraft:spawns_warm_variant_frogs', or 'minecraft:has_structure/mineshaft_mesa') where ore removal will be skipped. Applies to all ore types defined above.
	biome_blacklist = []

	#Ore Generation Config - Carnallite
	[evaporates.Carnallite]
		#Enable or Disable this Mineral
		disabled = true
		#how dense is the vein? 0 for all stone, 1 for all ore
		# Default: 0.5
		# Range: 0.0 ~ 1.0
		density = 0.5
		#The maximum size of a vein. Set to 0 to disable generation
		# Default: 12
		# Range: > 0
		vein_size = 12
		#The maximum Y coordinate this ore can spawn at
		# Default: 128
		# Range: > -2147483648
		max_y = 128
		#The minimum Y coordinate this ore can spawn at
		# Default: 24
		# Range: > -2147483648
		min_y = 24
		#The number of times a vein attempts to generate
		# Default: 1
		# Range: > 0
		attempts_per_chunk = 0
		#The chance that this mineral is generated in a chunk, 2_000_000 is guaranteed spawn 0 prevents spawns
		# Default: 45
		# Range: 0 ~ 2000000
		generation_chance = 45
		#Controls ore quality distribution. Lower values favor richer ores, while higher values increase the likelihood of poorer ores. 50 is balanced.
		# Default: 45
		# Range: 0 ~ 100
		rarity = 45
		#If enabled, mineral vein will only have a chance to spawn once every [16] chunks on average, inplace of every chunk.
		useSparsePlacement = false
		#A List of dimensions that this evaporate can generate in.
		dimension_whitelist = ["minecraft:overworld"]

